<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>SWIZ — Server connection test</title>
<style>
  body{font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;max-width:640px;margin:0 auto;padding:20px;background:#F6FBF2;color:#0A3D20}
  h1{font-size:22px;margin:0 0 4px} p{margin:6px 0 14px;color:#4F6656;line-height:1.5}
  input{width:100%;box-sizing:border-box;padding:14px;font-size:16px;border:1.5px solid #bcd6b3;border-radius:12px}
  button{margin-top:10px;width:100%;padding:14px;font-size:16px;font-weight:700;color:#fff;border:0;border-radius:999px;background:linear-gradient(100deg,#2E8B47,#0B5A2C);cursor:pointer}
  .t{margin-top:12px;padding:12px 14px;border-radius:12px;background:#fff;border:1.5px solid #dbe8d5}
  .t b{display:block}.ok{border-color:#2E8B47;background:#EAF6E3}.bad{border-color:#B3261E;background:#FDECEA}.wait{opacity:.7}
  small{display:block;margin-top:4px;color:#4F6656;line-height:1.45;word-break:break-word}
  code{background:#eef4ea;padding:1px 5px;border-radius:5px}
</style></head><body>
<h1>Server connection test</h1>
<p>Apne server ka URL daalo aur test dabao. Ye sirf <b>padhne wali</b> requests bhejta hai (koi SMS ya order nahi banta).</p>
<input id="u" type="url" inputmode="url" placeholder="https://swiz-api.onrender.com" autocomplete="off">
<button id="go">Test karo</button>
<div id="out"></div>
<script>
const out=document.getElementById('out'), u=document.getElementById('u');
try{ u.value=localStorage.getItem('swiz.testurl')||(window.SWIZ_API_BASE_URL||''); }catch(e){}
function row(cls,title,msg){ const d=document.createElement('div'); d.className='t '+cls; d.innerHTML='<b></b><small></small>'; d.firstChild.textContent=title; d.lastChild.textContent=msg||''; out.appendChild(d); return d; }
function set(d,cls,title,msg){ d.className='t '+cls; d.firstChild.textContent=title; d.lastChild.textContent=msg||''; }
async function call(url,opts){ const r=await fetch(url,opts); let j=null,txt=''; try{txt=await r.text(); j=JSON.parse(txt);}catch(e){} return {r,j,txt}; }
document.getElementById('go').onclick=async()=>{
  out.innerHTML=''; let base=u.value.trim().replace(/\/+$/,''); if(!base){ row('bad','URL daalo'); return; }
  try{ localStorage.setItem('swiz.testurl',base);}catch(e){}
  if(location.protocol==='https:' && base.startsWith('http://')){ row('bad','URL http:// hai','Ye page https par khula hai, isliye browser http:// server ko block karega. Server ka https:// URL use karo.'); return; }
  const a=row('wait','1) Server tak pahunch raha hai?','…');
  try{
    const {r,j}=await call(base+'/catalog/search?mode=food');
    if(r.ok){ set(a,'ok','1) Server chal raha hai (HTTP '+r.status+')', Array.isArray(j)||j? 'Catalog ka jawab mila.':'Jawab khaali hai, par server chal raha hai.'); }
    else if(r.status===404){ set(a,'bad','1) Server mila, par route nahi mila (404)','/catalog/search?mode=food backend mein nahi hai, ya URL ke aage koi extra path (jaise /api) lagana padega.'); }
    else { set(a,'bad','1) Server ne error diya (HTTP '+r.status+')',(j&&j.error)||'Backend ke logs dekho.'); }
  }catch(e){
    set(a,'bad','1) Server tak nahi pahunch paaya','Reason inme se koi: URL galat, server band/so raha hai (free hosting par 30-60 sec lagte hain), https nahi hai, ya CORS block kar raha hai. Dusra test (neeche) CORS batayega.');
  }
  const c=row('wait','2) CORS (app ko permission)?','…');
  try{
    const {r}=await call(base+'/catalog/search?mode=food',{headers:{'Content-Type':'application/json','Authorization':'Bearer test'}});
    set(c,'ok','2) CORS theek hai','Browser ne Authorization header wali request allow ki (HTTP '+r.status+').');
  }catch(e){
    set(c,'bad','2) CORS block ho raha hai','Backend mein CORS ON karo aur allow karo: headers Content-Type, Authorization; methods GET, POST, PUT, PATCH, DELETE, OPTIONS; origin = jahan se app khul raha hai ('+location.origin+').');
  }
  for(const p of ['/flash-offers','/catalog/search?mode=grocery']){
    const d=row('wait','3) GET '+p,'…');
    try{ const {r}=await call(base+p); set(d,r.ok?'ok':'bad','3) GET '+p+' → HTTP '+r.status, r.ok?'Theek.':'Ye route check karo.'); }catch(e){ set(d,'bad','3) GET '+p+' → fail','Network/CORS error.'); }
  }
  row('wait','Ab kya?','Sab ok aaye to config.js mein ye URL daalo: window.SWIZ_API_BASE_URL = \''+base+'\';');
};
</script></body></html>
