name: Build Android (debug APK + signed release AAB)
on:
  workflow_dispatch:
  push:
    branches: [main, master]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }

      - name: Check API URL
        id: api
        run: |
          URL=$(grep -oP "SWIZ_API_BASE_URL\s*=\s*'\K[^']*" www/config.js || true)
          OK=yes
          if [ -z "$URL" ]; then OK=no; echo "::warning::SWIZ_API_BASE_URL is empty - this APK will run in DEMO mode (fake data). Release AAB will be skipped."; fi
          if [ -n "$URL" ]; then
            case "$URL" in https://*) ;; *) echo "::error::API URL must start with https://"; exit 1;; esac
            if echo "$URL" | grep -Eq 'localhost|127\.0\.0\.1|192\.168\.|10\.0\.2\.2'; then echo "::error::API URL points to a local/dev address"; exit 1; fi
          fi
          echo "ok=$OK" >> $GITHUB_OUTPUT

      - run: npm install
      - run: npx cap add android
      - name: Icons and splash
        run: npx @capacitor/assets generate --android --iconBackgroundColor '#F4FBF0' --splashBackgroundColor '#F4FBF0'
      - run: npx cap sync android

      - name: Set versionCode / versionName
        run: |
          F=android/app/build.gradle
          sed -i "s/versionCode [0-9]*/versionCode ${{ github.run_number }}/" $F
          sed -i "s/versionName \"[^\"]*\"/versionName \"1.0.${{ github.run_number }}\"/" $F
          grep -n "versionCode\|versionName\|targetSdk" $F android/variables.gradle

      - name: Debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with: { name: swiz-delivery-debug-apk, path: android/app/build/outputs/apk/debug/app-debug.apk }

      - name: Decode keystore
        if: steps.api.outputs.ok == 'yes'
        env: { KS: "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" }
        run: |
          if [ -n "$KS" ]; then echo "$KS" | base64 -d > $GITHUB_WORKSPACE/release.keystore; echo "HAS_KS=1" >> $GITHUB_ENV; fi
      - name: Build release AAB
        if: env.HAS_KS == '1'
        working-directory: android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          ./gradlew bundleRelease --no-daemon \
            -Pandroid.injected.signing.store.file=$GITHUB_WORKSPACE/release.keystore \
            -Pandroid.injected.signing.store.password="$KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$KEY_PASSWORD"
      - name: Upload AAB
        if: env.HAS_KS == '1'
        uses: actions/upload-artifact@v4
        with: { name: swiz-delivery-release-aab, path: android/app/build/outputs/bundle/release/app-release.aab }
